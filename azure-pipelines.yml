# Praxsuite SDK for Unreal Engine - validate, package, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, package the plugin, mirror the source to the public GitHub repo, and
#                     cut a GitHub Release carrying the plugin zip.
#
# WHAT THIS PIPELINE CAN AND CANNOT PROVE - worth stating plainly, because the gap is real.
#
# It CAN compile and execute the whole portable core - the JSON codec, the PraxQL builder, filters,
# error classification, key handling and envelope parsing - with an ordinary compiler, warnings as
# errors, plus a sanitizer pass. That is where every rule in the conformance contract lives, and the
# contract exists precisely because breaking those rules produces wrong data rather than an error.
#
# It CANNOT compile the Unreal-facing layer. An Unreal plugin needs a licensed engine install of
# around 100 GB, and Epic's container images require account linkage and EULA acceptance, so no
# hosted or self-hosted agent here can build one. That layer is therefore deliberately as thin as
# possible - HTTP transport and Blueprint bindings, no logic - and the README says so rather than
# implying the whole plugin is tested.
#
# The honest gate for the engine layer is a human opening the plugin in Unreal once per release.

# There is deliberately no paths: exclude here. Excluding README.md looks like an easy saving, but
# the mirror-to-GitHub step in this pipeline IS how the public repo gets updated - so a
# documentation-only change would never reach a single reader.
trigger:
  branches:
    include:
      - master
      - development

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-UnrealEngine'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Test'
  jobs:
    - job: Validate
      # Two compilers, because they disagree about real things. g++ and clang++ differ on which
      # narrowing conversions and unhandled switch cases they warn about, and with -Werror a warning
      # is a failure - so building under both turns "my compiler was quiet" into an actual signal.
      strategy:
        matrix:
          gcc:
            compiler: 'g++'
            aptPackage: 'g++'
          clang:
            compiler: 'clang++'
            aptPackage: 'clang'
      steps:
        - script: |
            set -e
            # The agent image is a slim Debian container, so the toolchain is not present. apt rather
            # than a pinned download because these are Debian-stable packages: reproducible enough,
            # and there is no upstream release asset to verify a checksum against.
            if ! command -v $(compiler) >/dev/null 2>&1; then
              echo "Installing $(aptPackage)"
              (sudo apt-get update -qq && sudo apt-get install -y -qq $(aptPackage) make) \
                || (apt-get update -qq && apt-get install -y -qq $(aptPackage) make)
            fi
            $(compiler) --version
            make --version | head -1
          displayName: 'Install $(aptPackage)'

        - script: |
            set -e
            cd Tests
            make CXX=$(compiler) test
          displayName: 'Compile and run the conformance suite'

        # Warnings are already errors, but a clean compile says nothing about out-of-bounds reads.
        # The codec walks pointers over attacker-shaped strings - truncated escapes, unpaired
        # surrogates - so ASan/UBSan is the pass that would actually catch a buffer overrun in it.
        #
        # The probe first. clang's sanitizer run segfaulted here with ZERO test output even after
        # stdout was unbuffered, which means it died before main - so the suspect is the sanitizer
        # runtime, not the code under test. A trivial program settles that in one compile instead of
        # a morning of reading a JSON parser that gcc's ASan is perfectly happy with.
        #
        # The known cause is environmental: recent kernels widened ASLR entropy (vm.mmap_rnd_bits
        # 28 -> 32) and older ASan runtimes cannot map their shadow memory, dying instantly. The fix
        # is a sysctl this container is not privileged to set.
        #
        # So a broken runtime warns and skips rather than failing the build. Failing would be
        # dishonest in both directions: it reports a defect in code that has none, and once someone
        # gets tired of the red they delete the whole step - losing the gcc pass that DOES work.
        - script: |
            set -e
            # The probe lives in Tests/, NOT the agent temp directory. The first version built it
            # under $(Agent.TempDirectory) and reported BOTH compilers' runtimes as broken - while
            # gcc's sanitizer pass had demonstrably run the whole suite two builds earlier. The temp
            # mount is very likely noexec, so what the probe actually measured was its own inability
            # to execute anything, and it turned the build green by skipping work that was passing.
            # A gate that reports success by not running is worse than no gate.
            cd Tests
            printf 'int main() { return 0; }\n' > asan-probe.cpp

            # The probe uses address only, matching how the suite is now built. An earlier version
            # probed with address,undefined together - a combination measured to segfault before main
            # under Debian's clang while either sanitizer alone was clean - so the probe was testing
            # a configuration the Makefile no longer uses.
            if ! $(compiler) -fsanitize=address -o asan-probe asan-probe.cpp 2>&1; then
              echo "##vso[task.logissue type=warning]$(compiler) cannot link a sanitizer runtime here. Skipping."
              rm -f asan-probe asan-probe.cpp
              exit 0
            fi

            # The exit code is the whole point, so capture it rather than testing truthiness. 126 and
            # 127 mean the shell could not execute the file - a filesystem or linker problem that
            # says nothing about the sanitizer. Above 128 is a fatal signal, which IS the runtime
            # failing to start. Conflating those two is what produced the wrong diagnosis.
            set +e
            ./asan-probe
            PROBE_STATUS=$?
            set -e
            rm -f asan-probe asan-probe.cpp
            echo "Sanitizer probe exited $PROBE_STATUS"

            if [ "$PROBE_STATUS" -eq 0 ]; then
              echo "Sanitizer runtime works. Running the suite under it."
              make CXX=$(compiler) clean
              set +e
              make CXX=$(compiler) sanitize
              SAN_STATUS=$?
              set -e
              if [ "$SAN_STATUS" -eq 0 ]; then
                exit 0
              fi

              # The combined pass failed on a runtime whose probe was fine, so the fault is in the
              # code or in one specific sanitizer. Isolating which, here, beats guessing: the
              # combined build gives one bit of information and a refactor based on it might "fix"
              # something that was never broken.
              echo ""
              echo "===== the combined pass failed - isolating ====="
              INC="-I../Source/Praxsuite/Public -I."
              SRC="../Source/Praxsuite/Private/Core/PraxJson.cpp TestJson.cpp TestMain.cpp"

              for MODE in address undefined address,undefined; do
                LABEL=$(echo "$MODE" | tr ',' '-')
                echo ""
                echo "--- $MODE ---"
                set +e
                $(compiler) -std=c++17 -O1 -g -fno-omit-frame-pointer \
                  -fsanitize=$MODE $INC $SRC -o iso-$LABEL 2>&1 | tail -5
                ASAN_OPTIONS=print_stacktrace=1:handle_segv=1:fast_unwind_on_fatal=0 \
                UBSAN_OPTIONS=print_stacktrace=1 \
                  ./iso-$LABEL > iso-$LABEL.out 2>&1
                echo "exit $?"
                echo "last lines of output:"
                tail -25 iso-$LABEL.out
                set -e
                rm -f iso-$LABEL iso-$LABEL.out
              done

              echo ""
              echo "--- no sanitizer, same flags (does it crash without them?) ---"
              set +e
              $(compiler) -std=c++17 -O1 -g -fno-omit-frame-pointer $INC $SRC -o iso-none 2>&1 | tail -3
              ./iso-none > iso-none.out 2>&1
              echo "exit $?"
              tail -5 iso-none.out
              set -e
              rm -f iso-none iso-none.out

              echo "##vso[task.logissue type=error]The suite crashes under $(compiler)'s sanitizers. See the isolation output above for which one and where."
              exit 1
            fi

            if [ "$PROBE_STATUS" -ge 128 ]; then
              # Known cause: recent kernels widened ASLR entropy (vm.mmap_rnd_bits 28 -> 32) and
              # older ASan runtimes cannot map their shadow memory, dying on signal. The fix is a
              # sysctl this container is not privileged to set. Warn rather than fail: failing
              # reports a defect in code that has none, and once someone tires of the red they
              # delete the step and lose the pass entirely.
              echo "##vso[task.logissue type=warning]$(compiler)'s sanitizer runtime died on a signal (exit $PROBE_STATUS) running a program whose entire body is 'return 0'. That is the runtime, not the SDK. Skipping."
              exit 0
            fi

            echo "##vso[task.logissue type=error]The sanitizer probe exited $PROBE_STATUS, which is neither success nor a fatal signal. That is not a known-bad runtime - do not assume it is harmless."
            exit 1
          displayName: 'Re-run under ASan and UBSan'

        # The core must stay free of Unreal. If an engine header or type creeps in, CI silently
        # stops being able to compile it - and the loss shows up as a disabled test rather than a
        # failure, which is the sort of erosion nobody notices for months.
        - script: |
            set -e
            # Comments are stripped before matching. The first version of this gate failed on Core/'s
            # own header comment, which EXPLAINS why FString and TArray are absent - a gate that
            # cannot tell code from prose about the code fires on the documentation of the rule it
            # enforces, and the obvious fix is to stop writing the explanation down.
            SCAN=$(mktemp -d)
            for F in $(find Source/Praxsuite/Public/Core Source/Praxsuite/Private/Core -type f \( -name '*.h' -o -name '*.cpp' \)); do
              sed -e 's://.*::' "$F" > "$SCAN/$(echo "$F" | tr '/' '_')"
            done

            if grep -rEn '#include[[:space:]]*"(CoreMinimal|Engine/|UObject/|HAL/|Containers/)' "$SCAN" ; then
              echo "##vso[task.logissue type=error]An Unreal header is included from Core/. The core must stay portable so CI can compile it."
              exit 1
            fi
            if grep -rEn '\b(FString|TArray|TMap|UCLASS|USTRUCT|UFUNCTION|UPROPERTY|UE_LOG|TSharedPtr|TSharedRef)\b' "$SCAN" ; then
              echo "##vso[task.logissue type=error]An Unreal type appears in Core/. Convert at the engine boundary instead."
              exit 1
            fi
            rm -rf "$SCAN"
            echo "Core is free of Unreal types."
          displayName: 'Assert the core stays engine-free'
          condition: succeededOrFailed()

        # This repo is mirrored to a PUBLIC GitHub repo, so a key committed here reaches every
        # consumer.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' \
                 --include='*.cpp' --include='*.h' --include='*.cs' --include='*.md' \
                 --include='*.yml' --include='*.uplugin' --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'
          condition: succeededOrFailed()
