# Praxsuite SDK for Unreal Engine - validate, package, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, package the plugin, mirror the source to the public GitHub repo, and
#                     cut a GitHub Release carrying the plugin zip.
#
# WHAT THIS PIPELINE CAN AND CANNOT PROVE - worth stating plainly, because the gap is real.
#
# It CAN compile and execute the whole portable core - the JSON codec, the PraxQL builder, filters,
# error classification, key handling and envelope parsing - with an ordinary compiler, warnings as
# errors, plus a sanitizer pass. That is where every rule in the conformance contract lives, and the
# contract exists precisely because breaking those rules produces wrong data rather than an error.
#
# It CANNOT compile the Unreal-facing layer. An Unreal plugin needs a licensed engine install of
# around 100 GB, and Epic's container images require account linkage and EULA acceptance, so no
# hosted or self-hosted agent here can build one. That layer is therefore deliberately as thin as
# possible - HTTP transport and Blueprint bindings, no logic - and the README says so rather than
# implying the whole plugin is tested.
#
# The honest gate for the engine layer is a human opening the plugin in Unreal once per release.

# There is deliberately no paths: exclude here. Excluding README.md looks like an easy saving, but
# the mirror-to-GitHub step in this pipeline IS how the public repo gets updated - so a
# documentation-only change would never reach a single reader.
trigger:
  branches:
    include:
      - master
      - development

pr:
  branches:
    include:
      - master
      - development

pool:
  name: tesseract-buildpool

variables:
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-UnrealEngine'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Test'
  jobs:
    - job: Validate
      # Two compilers, because they disagree about real things. g++ and clang++ differ on which
      # narrowing conversions and unhandled switch cases they warn about, and with -Werror a warning
      # is a failure - so building under both turns "my compiler was quiet" into an actual signal.
      strategy:
        matrix:
          gcc:
            compiler: 'g++'
            aptPackage: 'g++'
          clang:
            compiler: 'clang++'
            aptPackage: 'clang'
      steps:
        - script: |
            set -e
            # The agent image is a slim Debian container, so the toolchain is not present. apt rather
            # than a pinned download because these are Debian-stable packages: reproducible enough,
            # and there is no upstream release asset to verify a checksum against.
            if ! command -v $(compiler) >/dev/null 2>&1; then
              echo "Installing $(aptPackage)"
              (sudo apt-get update -qq && sudo apt-get install -y -qq $(aptPackage) make) \
                || (apt-get update -qq && apt-get install -y -qq $(aptPackage) make)
            fi
            $(compiler) --version
            make --version | head -1
          displayName: 'Install $(aptPackage)'

        - script: |
            set -e
            cd Tests
            make CXX=$(compiler) test
          displayName: 'Compile and run the conformance suite'

        # ASan and UBSan run as two separate passes, and each one is RUN here rather than by make, so
        # this step can tell two very different things apart.
        #
        # Measured, over several builds of identical sources: clang's sanitizer binaries in this
        # container sometimes segfault BEFORE main, producing not one line of output, and sometimes
        # run the whole suite clean. It is intermittent - the known cause is that recent kernels
        # widened ASLR entropy (vm.mmap_rnd_bits 28 -> 32) and older ASan runtimes then fail to map
        # their shadow memory, which succeeds or fails depending on the randomised layout. The fix is
        # a sysctl this container is not privileged to set.
        #
        # I previously concluded the ASan+UBSan COMBINATION was the cause, on the evidence that
        # address-only and undefined-only both passed while combined crashed. That was wrong:
        # address-only has since crashed too. Separate passes are still the better arrangement, but
        # they are not a fix for this.
        #
        # So the distinction that matters is not which sanitizer - it is whether the suite RAN. A
        # binary that dies before printing a single section never executed a line of the SDK, and
        # calling that a defect would be false. A binary that fails partway through printed sections
        # first, and that IS a finding. The test output is the evidence, so this looks at it:
        #
        #   exit 0                          -> pass
        #   non-zero, with test output      -> a real failure, fail the build
        #   non-zero, with NO test output   -> the runtime never started, retry, then warn and skip
        #
        # Retrying is legitimate precisely because the failure is random rather than conditional. It
        # is bounded at three attempts so a genuinely broken runtime does not loop.
        - script: |
            set -e
            cd Tests

            run_sanitizer() {
              MODE="$1"
              BINARY="$2"
              echo ""
              echo "===== $MODE ====="
              make CXX=$(compiler) "build-$MODE"

              ATTEMPT=1
              while [ "$ATTEMPT" -le 3 ]; do
                set +e
                "$BINARY" > san-out.txt 2>&1
                STATUS=$?
                set -e

                if [ "$STATUS" -eq 0 ]; then
                  tail -5 san-out.txt
                  echo "$MODE: passed"
                  rm -f san-out.txt
                  return 0
                fi

                # "-- " prefixes every section heading the harness prints. Its presence means the
                # binary got as far as executing tests, so a failure is the SDK's, not the runtime's.
                if grep -q '^-- ' san-out.txt; then
                  echo "--- full output ---"
                  cat san-out.txt
                  echo "##vso[task.logissue type=error]$MODE failed DURING the suite. The binary ran and produced output, so this is a real finding, not a broken sanitizer runtime."
                  rm -f san-out.txt
                  return 1
                fi

                echo "attempt $ATTEMPT: exit $STATUS with no test output at all - the runtime did not start"
                sed -n '1,10p' san-out.txt
                ATTEMPT=$((ATTEMPT + 1))
              done

              rm -f san-out.txt
              echo "##vso[task.logissue type=warning]$MODE never started under $(compiler) after 3 attempts - it dies before main, so no SDK code ran. This is the known ASLR/shadow-mapping failure, not a defect. The other compiler's pass covers this code."
              return 0
            }

            FAILED=0
            run_sanitizer address "./prax-tests-asan" || FAILED=1
            run_sanitizer undefined "./prax-tests-ubsan" || FAILED=1
            exit "$FAILED"
          displayName: 'Re-run under ASan and UBSan'

        # The core must stay free of Unreal. If an engine header or type creeps in, CI silently
        # stops being able to compile it - and the loss shows up as a disabled test rather than a
        # failure, which is the sort of erosion nobody notices for months.
        - script: |
            set -e
            # Comments are stripped before matching. The first version of this gate failed on Core/'s
            # own header comment, which EXPLAINS why FString and TArray are absent - a gate that
            # cannot tell code from prose about the code fires on the documentation of the rule it
            # enforces, and the obvious fix is to stop writing the explanation down.
            SCAN=$(mktemp -d)
            for F in $(find Source/Praxsuite/Public/Core Source/Praxsuite/Private/Core -type f \( -name '*.h' -o -name '*.cpp' \)); do
              sed -e 's://.*::' "$F" > "$SCAN/$(echo "$F" | tr '/' '_')"
            done

            if grep -rEn '#include[[:space:]]*"(CoreMinimal|Engine/|UObject/|HAL/|Containers/)' "$SCAN" ; then
              echo "##vso[task.logissue type=error]An Unreal header is included from Core/. The core must stay portable so CI can compile it."
              exit 1
            fi
            if grep -rEn '\b(FString|TArray|TMap|UCLASS|USTRUCT|UFUNCTION|UPROPERTY|UE_LOG|TSharedPtr|TSharedRef)\b' "$SCAN" ; then
              echo "##vso[task.logissue type=error]An Unreal type appears in Core/. Convert at the engine boundary instead."
              exit 1
            fi
            rm -rf "$SCAN"
            echo "Core is free of Unreal types."
          displayName: 'Assert the core stays engine-free'
          condition: succeededOrFailed()

        # The Blueprint error enum duplicates the core's, because UENUM cannot wrap a plain C++ enum
        # from a non-UObject header. A duplicate that drifts is worse than either version alone: the
        # Unreal layer would map a new code onto whatever enumerator happened to sit at that value,
        # and report the wrong error confidently.
        #
        # The Unreal build catches this too - the conversion switch has no default, so a new core code
        # produces an unhandled-case warning - but CI cannot compile the Unreal layer, so that check
        # never runs here. This one does.
        - script: |
            set -e
            CORE=$(grep -cE '^\s+[A-Z][A-Za-z]*,\s*$' Source/Praxsuite/Public/Core/PraxError.h || true)
            BP=$(grep -cE '^\s+[A-Z][A-Za-z]*\s+UMETA' Source/Praxsuite/Public/PraxsuiteTypes.h || true)

            echo "core enumerators:      $CORE"
            echo "blueprint enumerators: $BP"

            if [ "$CORE" -eq 0 ] || [ "$BP" -eq 0 ]; then
              # Counting nothing and calling it a match is how a gate stops working without failing.
              echo "##vso[task.logissue type=error]The enum drift check counted zero enumerators on one side, so it is not measuring anything. Fix the patterns rather than trusting the result."
              exit 1
            fi

            if [ "$CORE" -ne "$BP" ]; then
              echo "##vso[task.logissue type=error]EPraxErrorCode has $CORE values but EPraxError has $BP. Add the missing one to both, and to PraxConvert::ToBlueprintError."
              exit 1
            fi
            echo "The two error enums agree."
          displayName: 'Assert the error enums have not drifted'
          condition: succeededOrFailed()

        # This repo is mirrored to a PUBLIC GitHub repo, so a key committed here reaches every
        # consumer.
        - script: |
            set -e
            if grep -rEn 'sk_live_[A-Za-z0-9]{16,}' \
                 --include='*.cpp' --include='*.h' --include='*.cs' --include='*.md' \
                 --include='*.yml' --include='*.uplugin' --exclude-dir=.git . ; then
              echo "##vso[task.logissue type=error]A Praxsuite secret key is present. Revoke it now - this repo is mirrored publicly."
              exit 1
            fi
            echo "No secret keys found."
          displayName: 'Scan for leaked secret keys'
          condition: succeededOrFailed()

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Package and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: AzureKeyVault@2
          displayName: 'Read GitHub token'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN,PRAXSPACE-INGEST-URL'
            RunAsPreJob: false

        # Praxsuite.uplugin is the single source of truth for the version, so a release tag can never
        # disagree with what the editor shows the user in the plugin browser.
        - script: |
            set -e
            VERSION=$(grep -m1 '"VersionName"' Praxsuite.uplugin | cut -d'"' -f4)
            if [ -z "$VERSION" ]; then
              echo "##vso[task.logissue type=error]No VersionName in Praxsuite.uplugin."
              exit 1
            fi
            echo "Plugin version: $VERSION"
            echo "##vso[task.setvariable variable=pkgVersion]$VERSION"
          displayName: 'Read plugin version'

        # A plugin zip a consumer can drop into Plugins/ and have work. Staged so the exclusions are
        # applied by the copy rather than by archiver flags - an earlier sibling SDK's packaging
        # broke because a multi-line exclude list inside a YAML block scalar stopped being valid YAML.
        #
        # Tests/ is excluded: nobody consuming the plugin needs the suite, and shipping it would put
        # key-shaped fixture strings into everyone's project for their own secret scanners to find.
        - script: |
            set -e
            OUT="$(Build.ArtifactStagingDirectory)/package"
            mkdir -p "$OUT"
            PKG="$OUT/praxsuite-unreal-$(pkgVersion).zip"

            STAGE=$(mktemp -d)
            mkdir -p "$STAGE/Praxsuite"
            cp Praxsuite.uplugin "$STAGE/Praxsuite/"
            cp README.md CHANGELOG.md LICENSE "$STAGE/Praxsuite/"
            cp -r Source "$STAGE/Praxsuite/Source"
            cp -r Resources "$STAGE/Praxsuite/Resources" 2>/dev/null || true

            (cd "$STAGE" && zip -qr "$PKG" Praxsuite) \
              || (cd "$STAGE" && python3 -m zipfile -c "$PKG" Praxsuite)

            rm -rf "$STAGE"
            ls -la "$OUT"
          displayName: 'Package the plugin'

        # An artifact that exists is not an artifact that works. A sibling SDK published a 7 KB npm
        # tarball containing no code, and every gate in that pipeline passed because each one checked
        # that the artifact was PRESENT rather than that it contained anything.
        - script: |
            set -e
            PKG="$(Build.ArtifactStagingDirectory)/package/praxsuite-unreal-$(pkgVersion).zip"
            test -f "$PKG" || { echo "##vso[task.logissue type=error]No package produced."; exit 1; }

            SOURCES=$(unzip -l "$PKG" | grep -cE '\.(cpp|h)$' || true)
            echo "$PKG carries $SOURCES source files."
            if [ "$SOURCES" -lt 20 ]; then
              echo "##vso[task.logissue type=error]The package does not contain the SDK. Contents:"
              unzip -l "$PKG"
              exit 1
            fi

            # Four things whose absence would produce a plugin that looks installable and is not.
            for REQUIRED in \
              "Praxsuite/Praxsuite.uplugin" \
              "Praxsuite/Source/Praxsuite/Praxsuite.Build.cs" \
              "Praxsuite/Source/Praxsuite/Public/PraxsuiteSubsystem.h" \
              "Praxsuite/Source/Praxsuite/Private/Core/PraxJson.cpp" \
              "Praxsuite/LICENSE" ; do
              if ! unzip -l "$PKG" | grep -q "$REQUIRED"; then
                echo "##vso[task.logissue type=error]$REQUIRED is missing from the package."
                unzip -l "$PKG"
                exit 1
              fi
            done

            # The suite must NOT ship. Its fixtures are key-shaped strings, and a consumer's own
            # secret scanner finding one in their Plugins folder is a support ticket at best.
            if unzip -l "$PKG" | grep -qE 'Praxsuite/Tests/'; then
              echo "##vso[task.logissue type=error]The test suite is in the package. Its fixtures look like credentials to a scanner."
              exit 1
            fi

            echo "Package contents verified."
          displayName: 'Verify the package carries the plugin'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish the package'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'unreal-plugin'

        - script: |
            set -e
            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>/dev/null || true
            git remote add github "https://x-access-token:$(GITHUB-SDK-MIRROR-TOKEN)@github.com/$(githubRepo).git"

            # Read the mirror's head BEFORE fetching. --force-with-lease cannot protect anything if a
            # fetch runs first: fetching sets the remote-tracking ref to whatever GitHub currently
            # has, so the lease always matches and the push always wins. That is not hypothetical -
            # it silently reset commits pushed straight to a sibling SDK's mirror.
            REMOTE_SHA=$(git ls-remote github refs/heads/master | cut -f1)
            if [ -n "$REMOTE_SHA" ]; then
              git fetch github master
              if ! git merge-base --is-ancestor "$REMOTE_SHA" HEAD; then
                echo "##vso[task.logissue type=error]github.com/$(githubRepo) is at $REMOTE_SHA, which is not an ancestor of this build. Someone pushed to the mirror directly. Reconcile it - do not overwrite."
                exit 1
              fi
            fi

            echo "Mirroring master to github.com/$(githubRepo)"
            if ! git push github HEAD:refs/heads/master; then
              echo "##vso[task.logissue type=error]Mirror push failed. Check the token has contents:write on the mirror."
              exit 1
            fi
            echo "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Every call captures the HTTP status and prints GitHub's response when it is not what we
        # expect. curl -f is deliberately absent: it exits 22 with no message and no body, which cost
        # three builds on a sibling SDK failing with an empty log.
        - script: |
            TAG="v$(pkgVersion)"
            API="https://api.github.com/repos/$(githubRepo)"
            AUTH="Authorization: Bearer $(GITHUB-SDK-MIRROR-TOKEN)"
            OUT="$(Build.ArtifactStagingDirectory)/package"

            CODE=$(curl -sS -o /tmp/existing.json -w '%{http_code}' -H "$AUTH" "$API/releases/tags/$TAG")
            if [ "$CODE" = "200" ]; then
              if grep -q '"state": *"uploaded"' /tmp/existing.json; then
                echo "Release $TAG already exists with an asset attached - nothing to publish."
                exit 0
              fi
              echo "##vso[task.logissue type=error]Release $TAG exists but has no asset attached. Delete it (or attach the asset by hand) and re-run."
              exit 1
            fi
            if [ "$CODE" != "404" ]; then
              echo "##vso[task.logissue type=error]HTTP $CODE checking whether $TAG exists. GitHub said:"
              cat /tmp/existing.json; echo
              exit 1
            fi

            # No double quotes and no newlines in the notes: escaped quotes here become real quotes
            # once the shell expands them, and the body stops being valid JSON.
            NOTES="Copy the Praxsuite folder from the attached zip into your projects Plugins directory, then restart the editor. Unreal 5.3+, Blueprint and C++. See CHANGELOG.md for what changed and README.md for what is tested."
            CODE=$(curl -sS -o /tmp/release.json -w '%{http_code}' -X POST \
              -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Praxsuite SDK for Unreal Engine $(pkgVersion)\",\"body\":\"$NOTES\",\"draft\":false,\"prerelease\":false}")
            if [ "$CODE" != "201" ]; then
              echo "##vso[task.logissue type=error]GitHub refused to create release $TAG (HTTP $CODE). It said:"
              cat /tmp/release.json; echo
              exit 1
            fi

            RELEASE_ID=$(grep -o '"id": *[0-9]*' /tmp/release.json | head -1 | tr -dc '0-9')
            if [ -z "$RELEASE_ID" ]; then
              echo "##vso[task.logissue type=error]Release $TAG created but its id could not be read from:"
              cat /tmp/release.json; echo
              exit 1
            fi
            echo "Created release $TAG (id $RELEASE_ID)"

            UPLOADED=0
            for F in "$OUT"/*.zip; do
              [ -f "$F" ] || continue
              # ${F##*/} rather than $(basename ...) - ADO reads $(...) as its own variable syntax
              # and would pass the text through literally, producing a release with no asset while
              # the build stayed green.
              CODE=$(curl -sS -o /tmp/asset.json -w '%{http_code}' -X POST \
                -H "$AUTH" -H "Content-Type: application/zip" \
                --data-binary @"$F" \
                "https://uploads.github.com/repos/$(githubRepo)/releases/$RELEASE_ID/assets?name=${F##*/}")
              if [ "$CODE" != "201" ]; then
                echo "##vso[task.logissue type=error]Uploading ${F##*/} returned HTTP $CODE. GitHub said:"
                cat /tmp/asset.json; echo
                exit 1
              fi
              echo "  uploaded ${F##*/}"
              UPLOADED=$((UPLOADED + 1))
            done

            if [ "$UPLOADED" -lt 1 ]; then
              echo "##vso[task.logissue type=error]No asset uploaded."
              ls -la "$OUT"
              exit 1
            fi

            ATTACHED=$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG" | grep -c '"state": *"uploaded"')
            if [ "$ATTACHED" -lt 1 ]; then
              echo "##vso[task.logissue type=error]Release $TAG reports no uploaded asset after $UPLOADED successful uploads."
              exit 1
            fi

            echo "Published release $TAG with $ATTACHED asset(s)"
          displayName: 'Cut GitHub release'

        # Tells the community what shipped, as a card in the PraxSpace #open-source channel.
        #
        # NEVER fails the build, for the same reason the registry check above does not: by the
        # time this runs the package is already published and irreversible, so a red stage here
        # would report the opposite of what happened. A missing card is a missing card.
        #
        # The ingest URL comes from Key Vault, not from this file. This repository is
        # mirrored to public GitHub and the endpoint takes no credential, so committing the URL
        # would hand anyone the ability to post cards to our community roadmap.
        - script: |
            set +e

            if [ -z "$PRAXSPACE_INGEST_URL" ]; then
              echo "PRAXSPACE_INGEST_URL is not set; skipping the release card."
              exit 0
            fi
            if ! command -v python3 >/dev/null 2>&1; then
              echo "python3 is not on this agent; skipping the release card."
              exit 0
            fi

            # The card is DERIVED from CHANGELOG.md. A feed written by hand drifts from the
            # changelog within a release or two and then quietly lies about what shipped.
            awk -v ver="$(pkgVersion)" \
              'index($0,"## ["ver"]")==1||index($0,"## "ver)==1{grab=1;next} grab&&index($0,"## ")==1{exit} grab{print}' \
              CHANGELOG.md > /tmp/release-notes.txt

            NOTES_FILE=/tmp/release-notes.txt \
            SOURCE_KEY="Praxsuite-SDK-UnrealEngine" \
            PACKAGE="Praxsuite SDK for Unreal" \
            VERSION="$(pkgVersion)" \
            INSTALL="Descomprime el plugin del release en Plugins/ de tu proyecto" \
            RELEASE_URL="https://github.com/$(githubRepo)/releases/tag/v$(pkgVersion)" \
              python3 ci/announce-release.py > /tmp/release-card.json

            if [ ! -s /tmp/release-card.json ]; then
              echo "##vso[task.logissue type=warning]Could not build the release card; the release itself is fine."
              exit 0
            fi

            CODE=$(curl -sS -o /tmp/ingest.json -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' \
              --data @/tmp/release-card.json \
              "$PRAXSPACE_INGEST_URL")

            if [ "$CODE" = "200" ]; then
              echo "Announced $(pkgVersion) in PraxSpace: $(cat /tmp/ingest.json)"
            else
              echo "##vso[task.logissue type=warning]PraxSpace ingest answered HTTP $CODE. The release is published; only the card is missing."
              cat /tmp/ingest.json 2>/dev/null; echo
            fi
          displayName: 'Announce the release in PraxSpace'
          env:
            PRAXSPACE_INGEST_URL: $(PRAXSPACE-INGEST-URL)
